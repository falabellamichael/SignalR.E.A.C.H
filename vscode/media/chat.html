<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}'; img-src {{cspSource}} data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{styleUri}}">
  <title>REACH Chat</title>
</head>
<body>
  <header id="topbar">
    <div class="brand-row">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="11" height="11"><path d="M8 1.6c.9 0 1.6.7 1.6 1.6 0 .6-.3 1.1-.8 1.4l4 4c.3-.5.8-.8 1.4-.8.9 0 1.6.7 1.6 1.6S15.1 11 14.2 11c-.6 0-1.1-.3-1.4-.8l-4 4c.5.3.8.8.8 1.4 0 .9-.7 1.6-1.6 1.6s-1.6-.7-1.6-1.6c0-.6.3-1.1.8-1.4l-4-4c-.3.5-.8.8-1.4.8C.9 11 .2 10.3.2 9.4S.9 7.8 1.8 7.8c.6 0 1.1.3 1.4.8l4-4c-.5-.3-.8-.8-.8-1.4C6.4 2.3 7.1 1.6 8 1.6z" fill="currentColor"/></svg>
      </span>
      <span class="brand-name">REACH</span>
      <span id="top-think" class="think-spinner" hidden aria-label="thinking"></span>
      <span id="model-chip" class="model-chip" title="Active model">—</span>
      <span class="brand-spacer"></span>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319z"/></svg>
      </button>
    </div>
    <div class="row search-row">
      <svg class="search-icon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zm-5.242.656a5 5 0 1 1 0-10 5 5 0 0 1 0 10z" fill="currentColor"/></svg>
      <input id="search" class="search-input" type="search" placeholder="Search chats…" title="Search your saved chats">
    </div>
    <div id="search-results" class="history-panel" hidden></div>
    <div id="settings-panel" class="settings-panel" hidden></div>
    <div id="history-panel" class="history-panel" hidden></div>
    <div class="endpoint-line" title="Endpoint">
      <span id="status-dot" class="status-dot"></span>
      <span id="endpoint">…</span>
    </div>
    <div id="workspace-line" class="endpoint-line" title="Workspace folder" hidden>…</div>
  </header>

  <main id="log" class="log" aria-live="polite">
    <div class="hint">Type a message below. Models and endpoint load automatically from your REACH relay.</div>
  </main>

  <footer id="composer">
    <div class="row">
      <select id="model" class="model-select" title="Model"></select>
      <button id="history-btn" class="icon-btn" title="Chat history" aria-label="Chat history">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 1.5A6.5 6.5 0 1 1 1.5 8H2.5A5.5 5.5 0 1 0 8 2.5V1.5z" fill="currentColor"/><path d="M8 3.5v4.2l3 1.8-.6 1-3.4-2V3.5h1z" fill="currentColor"/></svg>
      </button>
      <button id="clear-btn" class="icon-btn" title="Clear chat" aria-label="Clear chat">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6.5 1h3l.5 1H13v1H3V2h3l.5-1z" fill="currentColor"/><path d="M4 4.5h8l-.6 10.1a1 1 0 0 1-1 .9H5.6a1 1 0 0 1-1-.9L4 4.5zm1.2 1l.5 9h4.6l.5-9H5.2z" fill="currentColor"/></svg>
      </button>
      <button id="refresh" class="icon-btn" title="Reload models" aria-label="Reload models">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9l-1 1A4.5 4.5 0 1 0 12.5 8h1z" fill="currentColor"/><path d="M13.5 1.5v4h-4l1.3-1.3A6.5 6.5 0 1 1 1.5 8h1A5.5 5.5 0 1 0 11 2.8l2.5 2.5v-3.8h0z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="row">
      <textarea id="input" rows="2" placeholder="Ask REACH anything… (Enter to send, Shift+Enter for newline)"></textarea>
      <div class="send-col">
        <button id="send" class="send-btn" title="Send">➤</button>
        <button id="stop" class="stop-btn" title="Stop generating" aria-label="Stop generating" disabled>■</button>
      </div>
    </div>
    <div class="row toggles">
      <label id="agent-toggle" class="ws-toggle" title="Agentic mode — when on, REACH proposes code edits shown as diffs you can apply or discard">
        <input type="checkbox" id="agent-check" checked>
        <span class="ws-label">🤖 Agent</span>
      </label>
      <label id="ws-toggle" class="ws-toggle" title="Include the files open in VS Code as context for the model">
        <input type="checkbox" id="ws-check" checked>
        <span class="ws-label">📄 <span id="ws-count">Workspace</span></span>
      </label>
      <label id="think-toggle" class="ws-toggle" title="WhisperThink — the model reasons privately before answering (reasoning is never shown in the chat flow)">
        <input type="checkbox" id="think-check" checked>
        <span class="ws-label">🧠 Think</span>
      </label>
      <label id="web-toggle" class="ws-toggle" title="Web search — searches the web and injects fresh results + page excerpts before answering">
        <input type="checkbox" id="web-check" checked>
        <span class="ws-label">🌐 <span id="web-count">Web</span></span>
      </label>
    </div>
  </footer>

  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
