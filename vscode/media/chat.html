<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}'; img-src {{cspSource}} data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{styleUri}}">
  <title>REACH Chat</title>
</head>
<body>
  <header id="topbar">
    <div class="row">
      <select id="model" class="model-select" title="Model"></select>
      <button id="history-btn" class="icon-btn" title="Chat history" aria-label="Chat history">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 1.5A6.5 6.5 0 1 1 1.5 8H2.5A5.5 5.5 0 1 0 8 2.5V1.5z" fill="currentColor"/><path d="M8 3.5v4.2l3 1.8-.6 1-3.4-2V3.5h1z" fill="currentColor"/></svg>
      </button>
      <button id="clear-btn" class="icon-btn" title="Clear chat" aria-label="Clear chat">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6.5 1h3l.5 1H13v1H3V2h3l.5-1z" fill="currentColor"/><path d="M4 4.5h8l-.6 10.1a1 1 0 0 1-1 .9H5.6a1 1 0 0 1-1-.9L4 4.5zm1.2 1l.5 9h4.6l.5-9H5.2z" fill="currentColor"/></svg>
      </button>
      <button id="refresh" class="icon-btn" title="Reload models" aria-label="Reload models">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9l-1 1A4.5 4.5 0 1 0 12.5 8h1z" fill="currentColor"/><path d="M13.5 1.5v4h-4l1.3-1.3A6.5 6.5 0 1 1 1.5 8h1A5.5 5.5 0 1 0 11 2.8l2.5 2.5v-3.8h0z" fill="currentColor"/></svg>
      </button>
      <label id="ws-toggle" class="ws-toggle" title="Include the files open in VS Code as context for the model">
        <input type="checkbox" id="ws-check" checked>
        <span class="ws-label">📄 <span id="ws-count">Workspace</span></span>
      </label>
      <label id="think-toggle" class="ws-toggle" title="WhisperThink — the model reasons privately before answering (reasoning is never shown in the chat flow)">
        <input type="checkbox" id="think-check" checked>
        <span class="ws-label">🧠 Think</span>
      </label>
      <label id="web-toggle" class="ws-toggle" title="Web search — searches the web and injects fresh results + page excerpts before answering">
        <input type="checkbox" id="web-check" checked>
        <span class="ws-label">🌐 <span id="web-count">Web</span></span>
      </label>
    </div>
    <div id="history-panel" class="history-panel" hidden></div>
    <div id="endpoint" class="endpoint-line" title="Endpoint">…</div>
  </header>

  <main id="log" class="log" aria-live="polite">
    <div class="hint">Type a message below. Models and endpoint load automatically from your REACH relay.</div>
  </main>

  <footer id="composer">
    <textarea id="input" rows="1" placeholder="Ask REACH anything… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send" class="send-btn" title="Send">➤</button>
  </footer>

  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
