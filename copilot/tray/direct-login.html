<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>SignalREACH — Provider accounts</title>
  <style>
    :root{color-scheme:dark;font:15px/1.55 system-ui,sans-serif;color:#e9eef8;background:#10141e}
    body{margin:0;padding:32px;max-width:680px}h1{margin:0 0 8px;font-size:28px}p{color:#b9c5d9}
    #providers{display:grid;gap:12px;margin:24px 0}.provider{padding:16px;border:1px solid #34415a;border-radius:12px;display:flex;align-items:center;gap:16px;justify-content:space-between}
    .name{font-weight:650}.domain{font-size:13px;color:#a7b8d1}button{font:inherit;cursor:pointer;border:1px solid #6b8bdb;background:#284c9c;color:white;padding:9px 15px;border-radius:8px;white-space:nowrap}button:focus-visible{outline:3px solid #b6ceff;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}
    .note{font-size:13px;border-left:3px solid #7195ed;padding-left:14px}#status{min-height:24px;color:#c7dcff}
  </style>
</head>
<body>
  <h1>Provider accounts</h1>
  <p>Sign in to each provider in its own window. Your login stays with that provider.</p>
  <div id="providers" aria-label="Provider sign-in windows"></div>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="note">Your GPU models and the existing ChatGPT, Copilot and Gemini routes are configured. Additional provider routes will become available after sign-in and a successful model check.</p>
  <script src="direct-login-renderer.js"></script>
</body>
</html>
