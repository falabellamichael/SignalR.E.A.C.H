name: Windows suite

on:
  workflow_call:
    inputs:
      release-tag:
        description: Release tag to build and attach the installer to
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            studio/package-lock.json
            copilot/tray/package.json
            vscode/package.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install build dependencies
        shell: pwsh
        run: |
          foreach ($project in @('studio', 'copilot/tray', 'vscode')) {
            if (Test-Path "$project/package-lock.json") {
              npm ci --prefix $project
            } else {
              npm install --prefix $project
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and verify Windows suite
        run: python installer/windows/build.py
      - name: Upload suite installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signalreach-windows-suite
          path: |
            dist/windows-suite/SignalREACH Suite Setup *.exe
            dist/windows-suite/sha256.json
            dist/windows-suite/payload-manifest.json
          if-no-files-found: error
