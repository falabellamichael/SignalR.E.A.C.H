name: Studio Microsoft Store package

on:
  workflow_call:
    inputs:
      release-tag:
        description: Release tag (core vX) to build and attach the .appx to
        type: string
        default: ''
        required: false
  workflow_dispatch:
    inputs:
      release-tag:
        description: Optional release tag (core vX) to build and attach to (blank builds the current ref without attaching)
        type: string
        default: ''
        required: false

permissions:
  contents: write

jobs:
  appx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install Studio dependencies
        run: npm ci --prefix studio
      # Unsigned on purpose: Partner Center re-signs Store MSIX/AppX packages.
      - name: Build Store package
        working-directory: studio
        run: npm run dist:store
      - name: Upload Store package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reach-studio-store-appx
          path: studio/dist/*.appx
          if-no-files-found: error
      - name: Attach Store package to release
        if: inputs.release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release upload "$RELEASE_TAG" studio/dist/*.appx --clobber --repo "$GITHUB_REPOSITORY"
