name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    # Squash is the only merge strategy, so the PR title becomes the commit
    # subject release-please parses. Keep this regex in sync with
    # .githooks/commit-msg.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "PR title is not a Conventional Commit: $TITLE"
            echo "Expected e.g. 'feat(server): add failover' or 'fix!: drop legacy alias'"
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.9', '3.11', '3.13']
        include:
          # README claims 3.8+; 3.8 is not in the ubuntu-latest tool cache.
          - os: ubuntu-22.04
            python: '3.8'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (SHA-pinned)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (SHA-pinned)
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  lint:
    # SECURITY NOTE: the compileall / python -c steps below run with the repo
    # root at sys.path[0], so a PR adding a root-level `json.py` or
    # `compileall.py` could shadow the stdlib during these steps. Not
    # exploitable today: the runner is ephemeral, the token is read-only,
    # no secrets are in scope, and the `test` job on the same trigger already
    # executes PR-authored code by design. If this job ever gains secrets, a
    # write token, pull_request_target, or a self-hosted runner, isolate it
    # (run from a non-root cwd or a pinned container) before it becomes
    # a real attack surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (SHA-pinned)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (SHA-pinned)
        with:
          python-version: '3.13'
      - name: Byte-compile Python
        run: python -m compileall -q server tools tests
      - name: Parse JavaScript
        run: node tools/check-javascript.cjs
      - name: Test desktop tray and VS Code providers
        run: node --test tests/*.test.cjs
      - name: Check the plan's baseline against the tree (item 6.10)
        # docs/IMPROVEMENTS.md is the single document that states plan numbers, and
        # this is the check that keeps them true: the baseline is GENERATED, so a
        # measured file moving by one line without regenerating the table fails
        # here instead of rotting the plan. Run with --write to fix it.
        run: node tools/check-plan-baseline.cjs
      - name: Parse JSON
        run: for f in src/plugin.json vscode/package.json release-please-config.json .release-please-manifest.json; do python -c "import json,sys;json.load(open(sys.argv[1]))" "$f"; done

  studio:
    name: REACH Studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build:editor
      - run: npm run check
      - run: npm test
      - name: Coverage baseline
        if: runner.os == 'Linux'
        run: npm run test:coverage
      - name: Install Electron runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64 libgbm1 libatk-bridge2.0-0 libcups2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libpango-1.0-0 libcairo2 libx11-xcb1 xvfb flatpak flatpak-builder elfutils
      - name: Install Flatpak runtimes (Linux)
        if: runner.os == 'Linux'
        # Must match studio/package.json build.flatpak versions. --user so the
        # non-root runner and flatpak-builder see the same installation.
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08
      - name: macOS Electron smoke test
        if: runner.os == 'macOS'
        run: npm run smoke
      - name: Linux Electron smoke test (headless)
        if: runner.os == 'Linux'
        # GitHub runners have no root-owned SUID chrome-sandbox; Electron
        # aborts with SIGTRAP without this (same reason WSL needs it).
        env:
          ELECTRON_DISABLE_SANDBOX: 1
        run: xvfb-run -a npm run smoke
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: npm run dist:mac -- --dir
      - name: Package Linux installers
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Package Windows installers
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reach-studio-windows
          path: |
            studio/dist/*.exe
            studio/dist/*.exe.blockmap
          if-no-files-found: error
      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reach-studio-linux
          path: |
            studio/dist/*.AppImage
            studio/dist/*.deb
            studio/dist/*.zip
            studio/dist/*.flatpak
          if-no-files-found: error

  docker:
    name: Docker images (relay + GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build relay image
        run: docker build -f docker/reachd/Dockerfile -t signalreach-relay .
      - name: Boot relay container and verify from the host
        run: |
          docker run -d --name reachd -p 20777:20777 -v reachd-ci:/data signalreach-relay
          # Readiness: /health answers 200 (its body is redacted for non-local
          # callers, but it is reachable and that is the readiness signal).
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:20777/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { docker logs reachd; exit 1; }
          # The access model this branch ships: a request through the PUBLISHED
          # port is not a local client, so /v1/models must refuse it (401).
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:20777/v1/models || true)
          [ "$code" = "401" ] || { echo "expected 401 without a key, got $code"; docker logs reachd; exit 1; }
          # A genuine local client (inside the container) can mint a key...
          KEY=$(docker exec reachd python -c "import json,urllib.request; req=urllib.request.Request('http://127.0.0.1:20777/_reach/keys/ensure', data=json.dumps({'name': 'docker-ci'}).encode(), headers={'Content-Type': 'application/json'}, method='POST'); print(json.load(urllib.request.urlopen(req))['key'])")
          case "$KEY" in sk-reach-*) ;; *) echo "no key minted: $KEY"; docker logs reachd; exit 1;; esac
          # ...and that key unlocks the same route from the host.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $KEY" http://127.0.0.1:20777/v1/models || true)
          [ "$code" = "200" ] || { echo "expected 200 with a key, got $code"; docker logs reachd; exit 1; }
          docker inspect --format '{{.State.Health.Status}}' reachd | grep -qE 'healthy|starting'
          docker rm -f reachd
      - name: Build GUI image
        run: docker build -f docker/studio/Dockerfile -t reach-studio .
      - name: Smoke the GUI inside the container (Xvfb, shm 1g)
        run: |
          docker run --rm --shm-size=1g --entrypoint /bin/bash reach-studio -c '
            Xvfb :9 -screen 0 1600x900x24 -nolisten tcp >/dev/null 2>&1 &
            sleep 2
            exec timeout --signal=TERM --kill-after=10s 120s \
              env DISPLAY=:9 /opt/reach-studio/reach-studio --no-sandbox --smoke
          '
      - name: Smoke native-window passthrough (external display)
        # The entrypoint must detect an external display and launch Electron
        # on it instead of Xvfb/noVNC. Self-contained: Xvfb runs inside the
        # container as the "host display", no runner X server needed.
        run: |
          docker run -d --name studio-native --shm-size=1g \
            -e DISPLAY=:7 --entrypoint /bin/bash reach-studio -c '
              mkdir -p /tmp/.X11-unix
              Xvfb :7 -screen 0 1440x900x24 -nolisten tcp >/dev/null 2>&1 &
              sleep 2
              exec /entrypoint.sh
            '
          sleep 15
          docker logs studio-native | grep -q 'launching native window'
          docker exec studio-native pgrep -f 'reach-studio --type=renderer' >/dev/null
          docker exec studio-native sh -c 'DISPLAY=:7 xwininfo -root -tree | grep -q "Reach Studio"'
          docker rm -f studio-native
