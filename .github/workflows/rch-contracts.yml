name: RCH contracts

on:
  push:
    branches: [main]
    paths: ['RCH/**', '.github/workflows/rch-contracts.yml']
  pull_request:
    paths: ['RCH/**', '.github/workflows/rch-contracts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: RCH
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: RCH/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - run: npm test
      - run: npm run demo
