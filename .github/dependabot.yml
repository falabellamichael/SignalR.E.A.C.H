# Bumps SHA-pinned actions so the pins stay current (see the SECURITY NOTE
# in .github/workflows/ci.yml and the pin comment in release-please.yml).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/studio"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/vscode"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/copilot/tray"
    schedule:
      interval: "weekly"
